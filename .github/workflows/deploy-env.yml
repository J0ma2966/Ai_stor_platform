# Выкатка в одно окружение (staging/production). Вызывается из cd.yml.
# Настройки окружения (Settings → Environments → <имя>):
#   Variables: SITE_DOMAIN API_DOMAIN S3_DOMAIN MEDIA_DOMAIN
#              APP_SSH_HOST DB_SSH_HOST EDGE_SSH_HOST [REPLICA_SSH_HOST]
#              (один сервер: все три *_SSH_HOST и *_PRIVATE_IP одинаковые, REPLICA_* не задаются)
#              APP_PRIVATE_IP DB_PRIVATE_IP EDGE_PRIVATE_IP [REPLICA_PRIVATE_IP]
#   Secrets:   SSH_PRIVATE_KEY SSH_KNOWN_HOSTS ENV_APP ENV_DB ENV_EDGE [ENV_REPLICA]
#              AGE_IDENTITY TELEGRAM_BOT_TOKEN
# Файлы .env генерирует deploy/prod/scripts/init-env.sh (см. docs/DEPLOY.md).
name: deploy-env

on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      sha: {type: string, required: true}
      tag: {type: string, required: true}
      registry: {type: string, required: true}
      pg_tag: {type: string, required: true}
      backup_tag: {type: string, required: true}
    secrets:
      SSH_PRIVATE_KEY: {required: false}
      SSH_KNOWN_HOSTS: {required: false}
      ENV_APP: {required: false}
      ENV_DB: {required: false}
      ENV_REPLICA: {required: false}
      ENV_EDGE: {required: false}
      AGE_IDENTITY: {required: false}
      TELEGRAM_BOT_TOKEN: {required: false}

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.SITE_DOMAIN }}
    timeout-minutes: 40
    env:
      R: ${{ inputs.registry }}
      TAG: ${{ inputs.tag }}
      ENVNAME: ${{ inputs.environment }}
    steps:
      - id: cfg
        name: Is this environment configured?
        run: |
          if [[ -z "${{ vars.APP_SSH_HOST }}" ]]; then
            echo "::notice::Environment $ENVNAME is not configured (no APP_SSH_HOST) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {ref: "${{ inputs.sha }}"}
      - if: steps.cfg.outputs.skip != 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: steps.cfg.outputs.skip != 'true'
        name: Build site for this environment (NEXT_PUBLIC_* are baked in)
        env:
          TRYON_ENABLED: ${{ vars.TRYON_ENABLED }}
        run: |
          docker build -t "$R/web-$ENVNAME:$TAG" \
            --build-arg NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }} \
            --build-arg NEXT_PUBLIC_MEDIA_ORIGIN=https://${{ vars.MEDIA_DOMAIN }},https://${{ vars.S3_DOMAIN }} \
            --build-arg NEXT_PUBLIC_SITE_URL=https://${{ vars.SITE_DOMAIN }} \
            --build-arg NEXT_PUBLIC_TRYON_ENABLED="${TRYON_ENABLED:-false}" web
          docker push "$R/web-$ENVNAME:$TAG"
      - if: steps.cfg.outputs.skip != 'true'
        name: SSH
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host *\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' > ~/.ssh/config
      - if: steps.cfg.outputs.skip != 'true'
        name: Deploy (host agents -> db -> replica -> app -> edge)
        env:
          ENV_APP: ${{ secrets.ENV_APP }}
          ENV_DB: ${{ secrets.ENV_DB }}
          ENV_REPLICA: ${{ secrets.ENV_REPLICA }}
          ENV_EDGE: ${{ secrets.ENV_EDGE }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_HOST: ${{ vars.APP_SSH_HOST }}
          DB_HOST: ${{ vars.DB_SSH_HOST }}
          REPLICA_HOST: ${{ vars.REPLICA_SSH_HOST }}
          EDGE_HOST: ${{ vars.EDGE_SSH_HOST }}
          APP_IP: ${{ vars.APP_PRIVATE_IP }}
          DB_IP: ${{ vars.DB_PRIVATE_IP }}
          REPLICA_IP: ${{ vars.REPLICA_PRIVATE_IP }}
          EDGE_IP: ${{ vars.EDGE_PRIVATE_IP }}
          PG_TAG: ${{ inputs.pg_tag }}
          BK_TAG: ${{ inputs.backup_tag }}
        run: |
          set -euo pipefail
          dir=/opt/boutique/prod
          sync() { rsync -az --delete --exclude tests --exclude '*/.env' --exclude '*/secrets' --exclude 'edge/targets' deploy/prod/ "$1:$dir/"; }
          login() { printf '%s' "$GHCR_TOKEN" | ssh "$1" docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null; }
          logout() { ssh "$1" docker logout ghcr.io >/dev/null || true; }
          put() { ssh "$1" "umask 077; mkdir -p $(dirname "$2"); cat > $2"; }   # put <host> <path> < data
          envfile() { printf '%s\nREGISTRY=%s\nPG_IMAGE_TAG=%s\nBACKUP_IMAGE_TAG=%s\nDEPLOY_ENV=%s\n' "$1" "$R" "$PG_TAG" "$BK_TAG" "$ENVNAME"; }
          host_agents() { # <ssh host> <wg ip> <name>
            printf 'PRIVATE_IP=%s\nLOKI_PRIVATE_IP=%s\nHOST_NAME=%s\n' "$2" "$APP_IP" "$3" | put "$1" "$dir/host/.env"
            ssh "$1" "$dir/scripts/deploy.sh host"
          }

          single=false
          if [[ "$APP_HOST" == "$DB_HOST" && "$APP_HOST" == "$EDGE_HOST" && -z "$REPLICA_HOST" ]]; then single=true; fi
          if $single; then
            hosts=("$APP_HOST:$APP_IP:server")
          else
            hosts=("$DB_HOST:$DB_IP:db-primary" "$APP_HOST:$APP_IP:app" "$EDGE_HOST:$EDGE_IP:edge")
            [[ -n "$REPLICA_HOST" ]] && hosts+=("$REPLICA_HOST:$REPLICA_IP:db-replica")
          fi
          for h in "${hosts[@]}"; do IFS=: read -r ssh_host ip name <<<"$h"; sync "$ssh_host"; login "$ssh_host"; done
          trap 'for h in "${hosts[@]}"; do logout "${h%%:*}"; done' EXIT
          for h in "${hosts[@]}"; do IFS=: read -r ssh_host ip name <<<"$h"; echo "::group::host agents $name"; host_agents "$ssh_host" "$ip" "$name"; echo "::endgroup::"; done

          echo "::group::db primary"
          envfile "$ENV_DB" | put "$DB_HOST" "$dir/db/.env.new"
          if $single; then   # реплики нет: учебное восстановление дампа идёт на этом сервере
            printf '%s\n' "$AGE_IDENTITY" | put "$DB_HOST" "$dir/db/secrets/age-identity.txt"
            ssh "$DB_HOST" "chmod 644 $dir/db/secrets/age-identity.txt"
          fi
          ssh "$DB_HOST" "$dir/scripts/deploy.sh db"
          echo "::endgroup::"

          if [[ -n "$REPLICA_HOST" ]]; then
            echo "::group::db replica"
            envfile "$ENV_REPLICA" | put "$REPLICA_HOST" "$dir/db/.env.new"
            printf '%s\n' "$AGE_IDENTITY" | put "$REPLICA_HOST" "$dir/db/secrets/age-identity.txt"
            ssh "$REPLICA_HOST" "chmod 644 $dir/db/secrets/age-identity.txt && $dir/scripts/deploy.sh db"
            echo "::endgroup::"
          fi

          echo "::group::app"
          envfile "$ENV_APP" | put "$APP_HOST" "$dir/app/.env.new"
          ssh "$APP_HOST" "$dir/scripts/deploy.sh app $TAG"
          echo "::endgroup::"

          echo "::group::edge"
          envfile "$ENV_EDGE" | put "$EDGE_HOST" "$dir/edge/.env.new"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | put "$EDGE_HOST" "$dir/edge/secrets/telegram-bot-token"
          ssh "$EDGE_HOST" "chmod 644 $dir/edge/secrets/telegram-bot-token && $dir/scripts/deploy.sh edge $TAG"
          echo "::endgroup::"
      - if: steps.cfg.outputs.skip != 'true'
        name: Smoke check from the internet
        run: |
          for u in "https://${{ vars.API_DOMAIN }}/readyz" "https://${{ vars.SITE_DOMAIN }}/api/healthz"; do
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$u" && echo "ok $u"
          done
