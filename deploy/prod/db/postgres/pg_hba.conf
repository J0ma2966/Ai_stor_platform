# Порт 5432 публикуется только на приватном адресе WireGuard (см. compose.yml + firewall),
# поэтому здесь фильтр по ролям, а не по сетям. Только scram-sha-256, никакого trust.
# TYPE  DATABASE        USER            ADDRESS         METHOD
local   all             postgres                        peer
local   all             all                             scram-sha-256
host    replication     replicator      0.0.0.0/0       scram-sha-256
host    boutique        boutique        0.0.0.0/0       scram-sha-256
host    boutique        monitor         0.0.0.0/0       scram-sha-256
host    postgres        monitor         0.0.0.0/0       scram-sha-256
# суперпользователь — только из контейнеров этого же сервера (бэкап, WAL-G)
host    all             postgres        172.16.0.0/12   scram-sha-256
host    all             all             0.0.0.0/0       reject
host    all             all             ::/0            reject
