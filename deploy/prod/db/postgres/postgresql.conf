# Прод-конфигурация PostgreSQL 16. Размеры памяти задаются в compose.yml
# (переменные PG_*), чтобы подстроить под сервер без пересборки образа.
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256

# --- память/планировщик (значения по умолчанию для 8 vCPU / 32 ГБ / NVMe) ---
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 16MB
maintenance_work_mem = 1GB
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
huge_pages = try

# --- WAL, репликация, PITR (WAL-G) ---
wal_level = replica
wal_compression = zstd
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_senders = 10
max_replication_slots = 10
# слот реплики не даст переполнить диск, если реплика надолго пропала
max_slot_wal_keep_size = 50GB
hot_standby = on
hot_standby_feedback = on
archive_mode = on
# PGDATA/WAL-G переменные приходят из окружения контейнера.
archive_command = '/usr/local/bin/wal-g wal-push %p'
# RPO ≤ 60 с даже при низкой нагрузке
archive_timeout = 60
# на реплике/при восстановлении недостающие WAL берутся из архива
restore_command = '/usr/local/bin/wal-g wal-fetch %f %p'

# --- надёжность ---
statement_timeout = 0
idle_in_transaction_session_timeout = 60s
lock_timeout = 0

# --- логи (stdout контейнера -> Loki) ---
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500ms
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
# тела запросов с персональными данными в лог не пишем
log_statement = 'none'

# --- статистика для мониторинга ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on

# --- autovacuum под OLTP ---
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
