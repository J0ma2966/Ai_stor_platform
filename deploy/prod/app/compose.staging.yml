# Staging / локальная проверка с TLS_MODE=internal: API доверяет внутреннему CA Caddy.
# В prod НЕ используется (там Let's Encrypt). Ключи Caddy в API не попадают:
# ca-export копирует только публичный root.crt в отдельный том.
x-ca: &ca
  environment:
    SSL_CERT_DIR: /etc/ssl/certs:/staging-ca
  volumes: ["staging_ca:/staging-ca:ro"]
services:
  ca-export:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes: ["caddy_data:/data:ro", "staging_ca:/out"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/data/caddy/pki/authorities/local/root.crt
          [ -f "$$f" ] && cp "$$f" /out/caddy-root.crt && chmod 644 /out/caddy-root.crt
          sleep 30
        done
  api1: *ca
  api2: *ca
  api3: *ca
  migrate: *ca
volumes:
  staging_ca: {}
