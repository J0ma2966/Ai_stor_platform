# Сервер приложения в Узбекистане: Caddy (TLS) + 3 инстанса API + Redis + Loki (логи).
# PostgreSQL и MinIO — на сервере БД, доступ по WireGuard (DB_PRIVATE_IP).
# Обновление без простоя: deploy/prod/scripts/deploy-app.sh (по одному инстансу).
name: boutique-app

x-logging: &logging
  driver: json-file
  options: {max-size: "50m", max-file: "5"}

x-api: &api
  image: ${REGISTRY:?}/api:${IMAGE_TAG:?}
  restart: unless-stopped
  logging: *logging
  stop_grace_period: 30s
  # .env на сервере содержит и секреты API (JWT_SECRET, OTP_PEPPER, SMS, платежи)
  env_file: [./.env]
  environment:
    APP_ENV: ${APP_ENV:-prod}
    HTTP_ADDR: :8080
    INTERNAL_ADDR: 0.0.0.0:9090
    DATABASE_URL: postgresql://boutique:${APP_DB_PASSWORD:?}@${DB_PRIVATE_IP:?}:5432/boutique?sslmode=disable
    DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    # Подписанные ссылки на фото должны открываться в браузере, поэтому API ходит в
    # S3 по публичному имени; внутри сети имя указывает прямо на Caddy (алиас ниже).
    S3_ENDPOINT: ${S3_DOMAIN:?}
    S3_USE_SSL: "true"
    S3_BUCKET: ${S3_BUCKET:-boutique-media}
    S3_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?}
    S3_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}
    PUBLIC_MEDIA_URL: https://${MEDIA_DOMAIN:?}
    CORS_ORIGINS: https://${SITE_DOMAIN:?}
    COOKIE_SECURE: "true"
    TRUSTED_PROXY: "true"
    AUTO_MIGRATE: "false"
  depends_on:
    redis: {condition: service_healthy}
  deploy:
    resources:
      limits: {cpus: "${API_CPUS:-2}", memory: "${API_MEMORY:-2g}"}

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      TLS_MODE: ${TLS_MODE:-acme}
      API_DOMAIN: ${API_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?}
      S3_BUCKET: ${S3_BUCKET:-boutique-media}
      MINIO_UPSTREAM: ${DB_PRIVATE_IP:?}:9000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases: ["${S3_DOMAIN}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s

  api1:
    <<: *api
    ports: ["${PRIVATE_IP:?}:9101:9090"]
  api2:
    <<: *api
    ports: ["${PRIVATE_IP:?}:9102:9090"]
  api3:
    <<: *api
    ports: ["${PRIVATE_IP:?}:9103:9090"]

  # Разовый запуск миграций перед выкатом (deploy-app.sh): api migrate up
  migrate:
    <<: *api
    profiles: [tools]
    restart: "no"
    command: ["migrate", "up"]
    depends_on: []
    ports: []

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - volatile-lru
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_EXPORTER_CONFIG_COMMAND: "-"
    ports: ["${PRIVATE_IP:?}:9121:9121"]

  # Логи всех серверов (в них IP и маскированные телефоны — это ПД, поэтому Loki в UZ).
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["${PRIVATE_IP:?}:3100:3100"]
    volumes:
      - ../monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki

volumes:
  caddy_data: {}
  caddy_config: {}
  redis: {}
  loki: {}
