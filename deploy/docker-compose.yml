# Локальное окружение разработки: docker compose -f deploy/docker-compose.yml --env-file .env up --build
# Порты на компьютере меняются переменными *_HOST_PORT в .env (нужен --env-file .env,
# иначе compose ищет .env рядом с этим файлом, в deploy/). Внутри Docker порты стандартные.
name: boutique
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: boutique
    command: >
      postgres -c wal_level=replica -c max_connections=200 -c shared_buffers=256MB
      -c log_min_duration_statement=500 -c log_lock_waits=on
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    # Официальные образы minio/minio убраны с Docker Hub; pgsty — совместимый community-форк.
    image: pgsty/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-dev}
    ports: ["127.0.0.1:${MINIO_HOST_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"]
    volumes: [minio:/data]

  minio-init:
    image: pgsty/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin-dev}; do sleep 1; done;
             mc mb -p local/boutique-media; mc anonymous set none local/boutique-media; mc anonymous set download local/boutique-media/pub"

  api:
    build: ../backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://boutique:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/boutique?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_USE_SSL: "false"
      INTERNAL_ADDR: 0.0.0.0:9090
      AUTO_MIGRATE: "true"
      PUBLIC_MEDIA_URL: http://localhost:${MINIO_HOST_PORT:-9000}/boutique-media
      # dev: воркер AI-примерки внутри API, демо-провайдер без ключей (docs/TRYON.md)
      TRYON_PROVIDER: ${TRYON_PROVIDER:-mock}
      TRYON_WORKER_INPROCESS: "true"
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080", "127.0.0.1:${METRICS_HOST_PORT:-9090}:9090"]

  backup:
    build: {context: .., dockerfile: deploy/backup/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://boutique:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/boutique
      BACKUP_DIR: /backups
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      RETENTION_DAYS: "14"
    volumes: [backups:/backups]

volumes: {pgdata: {}, minio: {}, backups: {}}
