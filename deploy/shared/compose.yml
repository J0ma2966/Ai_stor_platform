# Облегчённая установка на ОБЩИЙ сервер (рядом с другим проектом): docs/SHARED_SERVER.md.
# Наружу ничего не публикуется: три порта только на 127.0.0.1, запросы принимает nginx сервера.
# Запуск только через команду ai-store (она подставляет /opt/ai-store/.env).
name: ai-store

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "3"}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: boutique
      POSTGRES_INITDB_ARGS: --data-checksums
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
      -c max_connections=60 -c log_min_duration_statement=500 -c log_lock_waits=on
    volumes: ["${DATA_DIR:?}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique"]
      interval: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 1g}}}

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    volumes: ["${DATA_DIR:?}/redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 256m}}}

  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports: ["127.0.0.1:${S3_PORT:-9100}:9000"]
    volumes: ["${DATA_DIR:?}/minio:/data"]
    deploy: {resources: {limits: {memory: 768m}}}

  # приватный бакет; анонимно читается только pub/ (фото товаров)
  minio-init:
    image: pgsty/mc@sha256:ce62c9053c69ce12a527a322345b5ad9f44b5f8a7b8189f82e516f2e3f30f1d8
    restart: "no"
    logging: *logging
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-boutique-media}
      BIOMETRIC_S3_BUCKET: ${BIOMETRIC_S3_BUCKET:-boutique-biometric}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done
        mc mb -p "local/$$S3_BUCKET" && mc anonymous set none "local/$$S3_BUCKET" && mc anonymous set download "local/$$S3_BUCKET/pub"
        # фото тела и результаты AI-примерки: отдельный полностью закрытый бакет
        mc mb -p "local/$$BIOMETRIC_S3_BUCKET" && mc anonymous set none "local/$$BIOMETRIC_S3_BUCKET"

  api:
    build: ../../backend
    image: ai-store/api:local
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    # в .env лежат и секреты API (JWT, почта, Telegram, оплата)
    env_file: ["${ENV_FILE:?}"]
    environment:
      HTTP_ADDR: :8080
      INTERNAL_ADDR: 0.0.0.0:9090
      DATABASE_URL: postgresql://boutique:${POSTGRES_PASSWORD}@postgres:5432/boutique?sslmode=disable
      DB_MAX_CONNS: "15"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Подписанные ссылки на фото открывает браузер, поэтому API ходит в S3 по публичному
      # имени; внутри контейнера оно ведёт на nginx этого же сервера (extra_hosts).
      S3_ENDPOINT: ${S3_DOMAIN:?}
      S3_USE_SSL: "true"
      S3_BUCKET: ${S3_BUCKET:-boutique-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Фото тела (AI-примерка) — в отдельном закрытом бакете того же MinIO. Страну хранения
      # и согласие владельца (BIOMETRIC_STORAGE_COUNTRY, BIOMETRIC_FOREIGN_APPROVED) задаёт
      # команда ai-store tryon on в .env.
      BIOMETRIC_S3_ENDPOINT: ${S3_DOMAIN}
      BIOMETRIC_S3_REGION: us-east-1
      BIOMETRIC_S3_USE_SSL: "true"
      BIOMETRIC_S3_BUCKET: ${BIOMETRIC_S3_BUCKET:-boutique-biometric}
      BIOMETRIC_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      BIOMETRIC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # очередь генераций работает внутри API (отдельный воркер на общем сервере не нужен)
      TRYON_WORKER_INPROCESS: "true"
      TRYON_WORKERS: ${TRYON_WORKERS:-2}
      PUBLIC_MEDIA_URL: https://${MEDIA_DOMAIN:?}
      CORS_ORIGINS: https://${SITE_DOMAIN:?}
      COOKIE_SECURE: "true"
      # nginx сервера записывает адрес клиента в X-Forwarded-For
      TRUSTED_PROXY: "true"
      AUTO_MIGRATE: "true"
    extra_hosts: ["${S3_DOMAIN}:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8180}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    deploy: {resources: {limits: {memory: 1g}}}

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?}
        NEXT_PUBLIC_MEDIA_ORIGIN: https://${MEDIA_DOMAIN},https://${S3_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_TRYON_ENABLED: ${TRYON_ENABLED:-false}
    image: ai-store/web:local
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 20s
    environment:
      # серверный рендеринг ходит в API напрямую, минуя nginx и лимит по IP
      API_INTERNAL_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    depends_on: [api]
    deploy: {resources: {limits: {memory: 768m}}}
