# Скопируйте в inventory.yml (в .gitignore) и впишите публичные адреса серверов.
# Схема по умолчанию: ОДИН сервер в UZ с именем server (имя важно: каталоги БД и
# доступ админов по WireGuard настраиваются для него). Схема из 4 серверов — ниже, в комментарии.
# wg_ip — адрес в приватной сети WireGuard 10.77.0.0/24 (как в deploy/prod/scripts/init-env.sh).
all:
  vars:
    ansible_user: root            # первый запуск; дальше — deploy (см. README)
    admin_ssh_keys:
      - "ssh-ed25519 AAAA... you@laptop"
    deploy_ssh_key: "ssh-ed25519 AAAA... github-actions-deploy"
  hosts:
    server: {ansible_host: 203.0.113.10, wg_ip: 10.77.0.10, public_web: true}

