org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Адрес API для release-сборок. Переопределяется: ./gradlew assembleRelease -Pboutique.apiUrl=https://api.example.uz
boutique.apiUrl=https://api.boutique.uz
# Debug-сборка в эмуляторе: 10.0.2.2 — это localhost компьютера, где запущен эмулятор.
boutique.debugApiUrl=http://10.0.2.2:8080
# Сайт (документы, кабинет магазина на сайте).
boutique.siteUrl=https://boutique.uz
